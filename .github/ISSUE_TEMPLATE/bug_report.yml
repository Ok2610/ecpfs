name: Bug report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: ecpfs version
      description: Output of `pip show ecpfs`, or the wheel/commit you built from
      placeholder: "0.9.98"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.14"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal code or CLI commands that reproduce it
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >-
        If you have logging enabled (see
        https://ok2610.github.io/ecpfs/logging.html), paste the relevant
        JSONL lines here.
      render: json
    validations:
      required: false
