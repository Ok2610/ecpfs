name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # extension-module refuses to link against libpython (Python provides those
      # symbols at dlopen time), which breaks cargo test's own test binary. See
      # the comment on the `extension-module` feature in Cargo.toml.
      - name: cargo test
        run: cargo test --no-default-features --verbose

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Build extension
        run: uv run maturin develop

      - name: pytest
        run: uv run pytest tests/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Sync dependencies
        run: uv sync --group dev

      # Sphinx autodoc imports the compiled extension for the Python API page.
      - name: Build extension
        run: uv run maturin develop

      # Both doc builds fail on warnings, so this catches a broken link or a
      # page missing from the table of contents before it reaches main.
      - name: Build site
        run: docs/build.sh
