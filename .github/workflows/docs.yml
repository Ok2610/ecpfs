name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# deploy-pages needs id-token to publish, and pages to write the site.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one partway through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Sync dependencies
        run: uv sync --group dev

      # Sphinx autodoc imports the compiled extension for the Python API page.
      - name: Build extension
        run: uv run maturin develop

      - name: Build site
        run: docs/build.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
