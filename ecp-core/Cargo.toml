[package]
name = "ecp-core"
version = "0.9.7"
edition = "2024"
readme = "../README.md"
license = "MIT OR Apache-2.0"
description = "Core eCP ANN index: tree search over lazily-loaded, Zarr-backed nodes"

[lib]
name = "ecp_core"
crate-type = ["rlib"]

[dependencies]
half = "2.7.1"
log = { version = "0.4.28", features = ["std"] }
lru = "0.18.4"
ndarray = "0.17.2"
num-traits = "0.2.19"
ordered-float = "5.5.0"
rand = "0.10.2"
rayon = "1.10.0"
rust-hdf5 = "0.5.1"
serde_json = "1.0.148"
time = { version = "0.3.44", features = ["formatting", "macros"] }
zarrs = "0.23.14"

[dev-dependencies]
tempfile = "3"
