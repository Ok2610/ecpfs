[package]
name = "ecp-py"
version = "0.9.5"
edition = "2024"
readme = "../README.md"
license = "MIT OR Apache-2.0"
description = "PyO3 bindings exposing ecp-core's Index to Python"

[lib]
name = "ecp"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
# `pyo3/extension-module` refuses to link against libpython (Python provides the
# symbols at dlopen time), which breaks `cargo test`'s own test binary. Build
# tests with `cargo test --no-default-features` to drop it.
extension-module = ["pyo3/extension-module"]

[dependencies]
ecp-core = { path = "../ecp-core" }
ndarray = "0.17.2"
numpy = { version = "0.29.0", features = ["half"] }
ordered-float = "5.5.0"
pyo3 = { version = "0.29.2" }
