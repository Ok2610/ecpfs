[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name        = "ecpfs"
version     = "0.9.98"
description = "Extended Cluster Pruning (eCP) approximate nearest neighbor index, with a Rust core"
authors     = [
    { name = "Omar Shahbaz Khan", email = "osk@oskhan.com" }
]
readme      = "README.md"
license     = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.14"

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent"
]

dependencies = [
  "numpy>=2.5.2"
]

[project.urls]
Documentation = "https://ok2610.github.io/ecpfs/"
Repository = "https://github.com/Ok2610/ecpfs"
Issues = "https://github.com/Ok2610/ecpfs/issues"

[dependency-groups]
dev = [
  "deptry>=0.23.0",
  "h5py>=3.12.1",
  "maturin>=1.0",
  "pytest>=9.1.1",
  "shibuya>=2026.7.12",
  "sphinx>=9.1.0",
]

[tool.maturin]
bindings = "pyo3"
python-source = "python"
module-name   = "ecpfs.ecp"
manifest-path = "ecp-py/Cargo.toml"
